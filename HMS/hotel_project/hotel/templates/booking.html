<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Room</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
}

.container{
width:400px;
margin:120px auto;
padding:30px;
background:white;
border-radius:10px;
box-shadow:0 0 10px gray;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#007bff;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<h2>Book Room {{room.room_number}}</h2>

<form method="post">
{% csrf_token %}

<label>Check In</label>
<input type="date" name="checkin" required>

<label>Check Out</label>
<input type="date" name="checkout" required>

<button type="submit">Confirm Booking</button>

</form>

</div>

</body>
</html>
