<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
}

.container{
width:80%;
margin:auto;
margin-top:50px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#007bff;
color:white;
}

a.button{
background:#28a745;
color:white;
padding:5px 10px;
text-decoration:none;
border-radius:5px;
}

.logout{
float:right;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Available Rooms</h2>

<a class="logout" href="/logout/">Logout</a>

<table>

<tr>
<th>Room Number</th>
<th>Room Type</th>
<th>Price</th>
<th>Action</th>
</tr>

{% for r in rooms %}

<tr>

<td>{{r.room_number}}</td>
<td>{{r.room_type}}</td>
<td>{{r.price}}</td>

<td>
<a class="button" href="/book/{{r.id}}">Book</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
