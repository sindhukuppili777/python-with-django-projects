
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<title>Dashboard</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
}

.dashboard{
    width:500px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
}

.menu button{
    width:80%;
    padding:10px;
    margin:10px;
    background:#007bff;
    color:white;
    border:none;
}

.menu button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="dashboard">
    <h2>Bank Dashboard</h2>

<p><b>Account Number:</b> {{account.account_number}}</p>

<p><b>Balance:</b> ₹ {{account.balance}}</p>


<div class="menu">

<form action="/deposit/">
<button>Deposit</button>
</form>

<form action="/withdraw/">
<button>Withdraw</button>
</form>

<form action="/transactions/">
<button>Transactions</button>
</form>

<form action="/logout/">
<button>Logout</button>
</form>

</div>

</div>

</body>
</html>
