<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
}

table{
margin:auto;
width:60%;
border-collapse:collapse;
background:white;
}

th{
background:#3498db;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

a{
text-decoration:none;
}

button{
padding:6px 12px;
background:green;
color:white;
border:none;
}

.top{
margin:20px;
}

</style>

</head>

<body>

<h2>Attendance Management</h2>

<div class="top">

<a href="/add/">Add Student</a> |
<a href="/attendance/">Attendance</a> |
<a href="/logout/">Logout</a>

</div>

<table>

<tr>
<th>Name</th>
<th>Email</th>
<th>Action</th>
</tr>

{% for s in students %}

<tr>

<td>{{s.name}}</td>
<td>{{s.email}}</td>

<td>

<a href="/mark/{{s.id}}/">
<button>Mark Present</button>
</a>

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
