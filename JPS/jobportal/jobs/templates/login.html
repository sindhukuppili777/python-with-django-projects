<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
<title>Login</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.login-box{
width:350px;
margin:80px auto;
background:white;
padding:20px;
box-shadow:0 0 5px gray;
border-radius:5px;
text-align:center;
}

input{
width:93%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
background:#007BFF;
color:white;
padding:10px;
border:none;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.register-link{
margin-top:10px;
display:block;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form method="post">

{% csrf_token %}

<input type="text" name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">

<button type="submit">Login</button>

</form>

<p class="register-link">
Don't have an account? 
<a href="{% url 'register' %}">Register here</a>
</p>

</div>

</body>
</html>
