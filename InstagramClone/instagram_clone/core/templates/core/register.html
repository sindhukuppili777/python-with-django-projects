<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Instagram Clone</title>

<style>

body{
    background:#fafafa;
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
}

.box{
    background:white;
    border:1px solid #dbdbdb;
    padding:40px;
    text-align:center;
}

.logo{
    font-size:40px;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:93%;
    padding:10px;
    margin:6px 0;
    border:1px solid #dbdbdb;
    border-radius:3px;
    background:#fafafa;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#0095f6;
    border:none;
    color:white;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    background:#1877f2;
}

.login-box{
    margin-top:10px;
    background:white;
    border:1px solid #dbdbdb;
    padding:20px;
    text-align:center;
}

a{
    text-decoration:none;
    color:#0095f6;
}

</style>

</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">Instagram</div>
{% if messages %}
    {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
    {% endfor %}
{% endif %}
        <form method="POST">

        {% csrf_token %}

        <input type="text" name="username" placeholder="Username">

        <input type="email" name="email" placeholder="Email">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">Register</button>

        </form>

    </div>

    <div class="login-box">

        Already have an account?
        <a href="/login/">Login</a>

    </div>

</div>

</body>
</html>
